; Thermomètre de four connecté — firmware ESP32-S3
; Compiler :           pio run -e feather_s3
; Flasher :            pio run -e feather_s3 -t upload
; Interface web :      pio run -e feather_s3 -t uploadfs
; Tests natifs :       pio test -e native

[platformio]
default_envs = feather_s3

[env:feather_s3]
platform = espressif32@6.9.0
board = adafruit_feather_esp32s3_nopsram
framework = arduino
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit MAX1704X@^1.0.3
    olikraus/U8g2@^2.36.2
    bblanchon/ArduinoJson@^7.2.0
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0

[env:native]
platform = native
test_build_src = no
lib_compat_mode = off
